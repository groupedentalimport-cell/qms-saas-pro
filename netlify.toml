# =============================================================================
# QMS SaaS Pro — Netlify Configuration
# =============================================================================
# Builds the Vite + React app from the qms-saas-pro/ subdirectory.
# The enriched QMS templates (CAPA, NCR, Audit, Document, etc.) live there.
# =============================================================================

[build]
  base = "qms-saas-pro/"
  command = "npm run build"
  publish = "dist/"

# SPA redirect — all routes served by index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
